<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Registration Form</title>

<style>

#hide {
  display: none;
}

.container {
  width: 200px;
  margin: auto;
  border: 1px solid black;
  padding: 20px;
}

button:hover {
  background-color: green;
}

#title {
  font-weight: bold;
  text-transform: uppercase;
  text-align: center;
}

#box {
  border: 1px solid black;
  padding: 10px;
}

.item {
  color: red;
}

.flex-center {
  display: flex;
  justify-content: center;
  align-items: center;
  height: 50px;
}

</style>
</head>

<body>

<h2 id="title">Registration Form</h2>

<div class="container">

<form id="regForm">

<label>Name:</label>
<input type="text" id="name" name="username" required><br><br>

<label>Email:</label>
<input type="email" name="email"><br><br>

<label>Age (1–10):</label>
<input type="number" min="1" max="10"><br><br>

Gender:
<input type="radio" name="gender" checked> Male
<input type="radio" name="gender"> Female<br><br>

<input type="checkbox" required> I Agree<br><br>

Profile Completion:
<progress value="50" max="100"></progress><br><br>

<fieldset id="box">
<legend>Personal Info</legend>
<span class="item">Grouped fields example</span>
</fieldset><br>

<button type="submit" id="btn" onclick="showMsg(event)">
Submit
</button>

</form>

<p id="demo"></p>

</div>

<br>
<a href="https://example.com" target="_blank">
Visit Website
</a>

<script>

document.body.style.backgroundColor = "white";

console.log(new Date());

function showMsg(event) {

  event.preventDefault();

  alert("Hello");

  var name = document.getElementById("name").value;

  document.getElementById("demo").innerHTML =
    "Entered Name: " + name;

  document.getElementById("btn").innerHTML = "Clicked";

  var num = 12;
  if (num > 10) {
    console.log("Greater");
  }

  var a = 5, b = 3;
  var sum = a + b;
  console.log("Sum:", sum);
}

</script>

</body>
</html>
